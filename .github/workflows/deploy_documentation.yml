name: "Deploy Documentation"

on:
  push:
    branches:
      - main

jobs:
  install:
    name: "Install"
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup pnpm Dependencies"
        uses: ./.github/actions/use-pnpm-dependencies

  deploy:
    name: "Deploy"
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "📦 Setup pnpm Dependencies"
        uses: ./.github/actions/use-pnpm-dependencies
      - name: "🏗️ Build"
        run: pnpm build:docs
      - name: "🚀 Deploy"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.WRITE_REPOS_TOKEN }}
          publish_dir: ./packages/documentation/dist
          user_name: agoralabs-bot
          user_email: tech@agoralabs.sh
